lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: 5.9.3
        version: 5.9.3

  apps/web:
    dependencies:
      '@mycel/shared':
        specifier: workspace:*
        version: link:../../packages/shared

  packages/cli:
    dependencies:
      '@mycel/core':
        specifier: workspace:*
        version: link:../core
      '@mycel/server':
        specifier: workspace:*
        version: link:../server
      '@mycel/shared':
        specifier: workspace:*
        version: link:../shared

  packages/core:
    dependencies:
      '@mycel/db':
        specifier: workspace:*
        version: link:../db
      '@mycel/parser':
        specifier: workspace:*
        version: link:../parser
      '@mycel/shared':
        specifier: workspace:*
        version: link:../shared

  packages/db:
    dependencies:
      '@mycel/shared':
        specifier: workspace:*
        version: link:../shared

  packages/parser:
    dependencies:
      '@mycel/shared':
        specifier: workspace:*
        version: link:../shared

  packages/server:
    dependencies:
      '@mycel/core':
        specifier: workspace:*
        version: link:../core
      '@mycel/shared':
        specifier: workspace:*
        version: link:../shared

  packages/shared: {}

packages:

  typescript@5.9.3:
    resolution: {integrity: sha512-jl1vZzPDinLr9eUt3J/t7V6FgNEw9QjvBPdysz9KfQDD41fQrC2Y4vKQdiaUpFT4bXlb1RHhLpp8wtm6M5TgSw==}
    engines: {node: '>=14.17'}
    hasBin: true

snapshots:

  typescript@5.9.3: {}
